<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Предметы офиса — снимки моделей</title><script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js"}}</script><style>body{margin:0;background:#1e2d38;color:#f1e9dc;font:16px 'Segoe UI',sans-serif}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{min-height:44px;padding:8px 12px;font:inherit}#stage{width:720px;height:480px;max-width:100%;background:radial-gradient(ellipse at 50% 60%,#344c54,#1b2b36 75%)}canvas{display:block;width:100%;height:100%}p{padding:0 16px}</style></head><body><header><label>Предмет <select id="item"><option value="lounge">Уютный отдых</option><option value="quiet">Тихий офис</option><option value="computers">Компьютеры</option><option value="coffee">Напитки</option><option value="desk4">Четвёртое место</option><option value="desk5">Пятое место</option></select></label><button id="save">Сохранить WebP</button></header><div id="stage" data-model-viewer="lounge"></div><p>Снимок 720 × 480. Сохрани результат в assets/previews/ и обнови receipt с хешами.</p><script type="module">import{UpgradeModelViewer}from'../../assets/upgrade-model-viewer.js';const host=document.querySelector('#stage'),viewer=new UpgradeModelViewer(host,{width:720,height:480});let ready=viewer.show('lounge');document.querySelector('#item').onchange=e=>{ready=viewer.show(e.target.value);};document.querySelector('#save').onclick=async()=>{await ready;viewer.draw();viewer.renderer.domElement.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='upgrade-'+viewer.id+'.webp';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);},'image/webp',.92);};</script></body></html>
